<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — PDFForge</title>
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon/favicon-32x32.png" sizes="32x32" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%);
        color: #f8fafc;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 480px; }
      .logo {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        border-radius: 24px;
        background: #7c3aed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        font-weight: 800;
        color: #ffffff;
      }
      h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
      p { color: #cbd5e1; line-height: 1.6; font-size: 15px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        padding: 12px 28px;
        border-radius: 999px;
        background: #7c3aed;
        color: #ffffff;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }
      .btn:hover { background: #8b5cf6; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">F</div>
      <h1>You're offline</h1>
      <p>
        PDFForge needs an internet connection to load its tools. Once you're back online,
        your files will work as usual — and they're always processed locally in your browser.
      </p>
      <button class="btn" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
