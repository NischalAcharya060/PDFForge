<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23e5484d'/%3E%3Cpath d='M6 9V4h8l3 3v13H6V9z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <title>PDFForge Viewer</title>
  </head>
  <body>
    <header id="toolbar">
      <div class="toolbar-group left">
        <button id="btn-open" class="icon-btn" title="Open PDF (Ctrl+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M3 9h18" />
          </svg>
        </button>
        <button id="btn-print" class="icon-btn" title="Print (Ctrl+P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V3h12v6" />
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <rect x="6" y="14" width="12" height="7" rx="1" />
          </svg>
        </button>
        <span id="doc-name">PDFForge Viewer</span>
      </div>

      <div class="toolbar-group center">
        <button id="btn-prev" class="icon-btn" title="Previous page (←)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <span id="page-indicator">— of —</span>
        <button id="btn-next" class="icon-btn" title="Next page (→)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6" />
          </svg>
        </button>
      </div>

      <div class="toolbar-group right">
        <button id="btn-fit-width" class="icon-btn" title="Fit to width">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 8l-5 4 5 4" />
            <path d="M15 8l5 4-5 4" />
          </svg>
        </button>
        <button id="btn-fit-page" class="icon-btn" title="Fit to page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V4h5" />
            <path d="M20 9V4h-5" />
            <path d="M4 15v5h5" />
            <path d="M20 15v5h-5" />
          </svg>
        </button>
        <button id="btn-zoom-out" class="icon-btn" title="Zoom out (Ctrl+-)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M8 11h6" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
        </button>
        <select id="zoom-select" aria-label="Zoom level" title="Zoom level"></select>
        <button id="btn-zoom-in" class="icon-btn" title="Zoom in (Ctrl++)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M8 11h6" />
            <path d="M11 8v6" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="btn-thumbs" class="icon-btn" title="Toggle thumbnails (T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="Toggle dark mode (D)">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <div id="viewport">
      <aside id="thumbnails" hidden>
        <div id="thumb-list"></div>
      </aside>
      <main id="page-host" tabindex="0"></main>
    </div>

    <div id="empty-state">
      <div class="empty-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3v4a1 1 0 0 0 1 1h4" />
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
          <path d="M9 13h6" />
          <path d="M9 17h6" />
        </svg>
        <h1>Open a PDF</h1>
        <button id="btn-open-empty" class="primary-btn">Open PDF</button>
        <p class="empty-hint">or drop a PDF anywhere in this window</p>
      </div>
    </div>

    <div id="error-state" hidden>
      <div class="error-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        </svg>
        <h1 id="error-title">Couldn't open this file</h1>
        <p id="error-message"></p>
        <div class="error-actions">
          <button id="btn-error-open" class="primary-btn">Open another PDF</button>
          <button id="btn-error-dismiss" class="plain-btn">Dismiss</button>
        </div>
      </div>
    </div>

    <div id="loading-bar" hidden></div>

    <div id="drop-overlay" hidden>
      <div class="drop-badge">Drop PDF to open</div>
    </div>

    <div id="password-modal" hidden>
      <div class="modal">
        <div class="modal-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
          <span>Password protected</span>
        </div>
        <p id="password-note">This PDF requires a password to open.</p>
        <input id="password-input" type="password" placeholder="Enter password" autocomplete="off" spellcheck="false" />
        <p id="password-error" class="form-error" hidden>The password is incorrect. Try again.</p>
        <div class="modal-actions">
          <button id="btn-password-cancel" class="plain-btn">Cancel</button>
          <button id="btn-password-ok" class="primary-btn">Unlock</button>
        </div>
      </div>
    </div>

    <div id="print-host"></div>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
